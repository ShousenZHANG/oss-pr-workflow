name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Scripts start
        shell: bash
        run: |
          for script in skills/oss-pr/scripts/[a-z]*.py; do
            python "$script" --help > /dev/null
          done
